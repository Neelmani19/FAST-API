name: Agent Evals
# Runs the eval set to measure the triage agent's quality.
# Triggers when the agent or the eval set changes, or on demand.
# This is "CI for the agent": a prompt/model change that lowers the score is blocked.
on:
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  pull_request:
    # paths:
    #   - 'agent/**'
    #   - 'evals/**'

jobs:
  agent-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Run the eval set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python evals/run_evals.py --threshold 0.8

      - name: Save the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.json
