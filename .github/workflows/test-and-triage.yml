name: Test and Triage
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # required to post the triage comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        id: pytest
        run: |
          set +e
          pytest -v 2>&1 | tee pytest_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.pytest.outputs.exit_code != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Triage the failure
        if: steps.pytest.outputs.exit_code != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat pytest_output.txt | claude -p \
            "You are triaging a failing pytest run in CI. Read the failing test and the code it exercises, then explain the single most likely ROOT CAUSE concisely. State whether the bug is in the app code or the test, and name the file and line. Do not fix anything, just explain." \
            --output-format json \
            --allowedTools "Read,Grep,Glob" \
            > triage.json
          jq -r '.result' triage.json > triage.md

      - name: Comment root cause on the PR
        if: steps.pytest.outputs.exit_code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('triage.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔍 Claude Code triage\n\n${body}`
            });

      - name: Reflect the real test result
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
